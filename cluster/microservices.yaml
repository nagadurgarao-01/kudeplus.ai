---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-leak-worker
  namespace: default
  labels:
    app: worker
    role: memory-stress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-leak-worker
  template:
    metadata:
      labels:
        app: memory-leak-worker
    spec:
      containers:
      - name: mem-stress
        image: polinux/stress
        args: ["stress", "--vm", "1", "--vm-bytes", "128M"]
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: high-cpu-batch-job
  namespace: default
  labels:
    app: analytics
    role: cpu-stress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: high-cpu-batch-job
  template:
    metadata:
      labels:
        app: high-cpu-batch-job
    spec:
      containers:
      - name: cpu-stress
        image: polinux/stress
        args: ["stress", "--cpu", "1"]
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "1000m"
            memory: "256Mi"
